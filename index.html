  <a class="wordmark" href="index.html"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><circle cx="11" cy="24" r="5" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="17" cy="24" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/><circle cx="24" cy="24" r="18" fill="none" stroke="currentColor" stroke-width="2.4" opacity=".45"/><circle cx="6" cy="24" r="3.4" fill="#0057ff"/></svg>Many Worlds</a>

<main class="hero">
  <canvas id="worlds" aria-hidden="true"></canvas>
  <div class="hero-copy">
    <h1>We invest in category&#8209;defining teams in quantum.</h1>
    <p>Strategic opportunities at any stage, from pre-seed to IPO and SPAC.</p>
    <div class="cta-row">
      <form class="subscribe" id="subscribe" action="/api/subscribe" method="post" novalidate>
        <label class="visually-hidden" for="subscribe-email">Email</label>
        <input id="subscribe-email" name="email" type="email" autocomplete="email" placeholder="Your email" required>
        <input class="visually-hidden" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
        <button type="submit">Subscribe</button>
      </form>
      <a class="cta" href="mailto:contact@manyworldscapital.com">Get in touch</a>
    </div>
    <p class="subscribe-note" id="subscribe-note" role="status" aria-live="polite">Many Worlds Weekly: quantum news for investors, every Friday.</p>
  </div>
</main>
<footer class="site-footer">
  <span>© 2026 Many Worlds GP, LLC</span>
  <nav aria-label="Legal">
    <a href="legal.html">Legal</a>

  </nav>
</footer>
<script src="worlds.js"></script>
<script>
(function () {
  var form = document.getElementById('subscribe');
  var note = document.getElementById('subscribe-note');
  var input = form.elements.email;
  var button = form.querySelector('button');
  var q = new URLSearchParams(location.search).get('subscribed');
  if (q === '1') done();
  if (q === '0') say('Something went wrong. Please try again.', true);

  function say(text, isError) {
    note.textContent = text;
    note.classList.toggle('is-error', !!isError);
  }
  function done() {
    form.classList.add('is-done');
    input.disabled = true;
    button.disabled = true;
    button.textContent = 'Subscribed';
    say("You're in. Check your inbox for a welcome email.");
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var email = input.value.trim();
    if (!/^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(email)) {
      say('Please enter a valid email.', true);
      input.focus();
      return;
    }
    button.disabled = true;
    button.textContent = 'Subscribing…';
    fetch('/api/subscribe', {
      method: 'POST',
      headers: { 'content-type': 'application/json', accept: 'application/json' },
      body: JSON.stringify({ email: email, company: form.elements.company.value })
    })
      .then(function (r) { return r.json().catch(function () { return { ok: false }; }); })
      .then(function (data) {
        if (data.ok) return done();
        button.disabled = false;
        button.textContent = 'Subscribe';
        say(data.error || 'Something went wrong. Please try again.', true);
      })
      .catch(function () {
        button.disabled = false;
        button.textContent = 'Subscribe';
        say('Something went wrong. Please try again.', true);
      });
  });
})();
</script>
</body>
</html>
